[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "duet-segmenter"
version = "0.1.0"
description = "Reference-aware learner speech timestamps for completed TikTok Duets"
requires-python = ">=3.11,<3.13"
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "soundfile>=0.12",
  "matplotlib>=3.7",
  "PyYAML>=6",
  "silero-vad>=6.0",
  "pywebrtc-audio>=0.2",
  "opencv-python-headless>=4.8",
]

[project.optional-dependencies]
console = ["streamlit>=1.55", "plotly>=5", "pandas>=2"]
evidence = ["faster-whisper>=1.2,<2", "praat-parselmouth>=0.4.6,<1"]
test = ["pytest>=8", "jsonschema>=4", "playwright>=1.50"]

[project.scripts]
duet-segment = "duet_segmenter.cli:main"
p2-evidence = "speaking_evidence.runner:main"

[tool.setuptools.packages.find]
include = ["duet_segmenter*", "duet_speech_lab*", "speaking_evidence*"]

[tool.setuptools.package-data]
duet_segmenter = ["defaults.yaml", "result.schema.json"]
